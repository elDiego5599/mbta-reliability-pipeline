[project]
name = "mbta-reliability"
version = "0.1.0"
description = "Batch pipeline measuring MBTA bus and rapid transit reliability from GTFS Realtime."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "zstandard>=0.25.0",
]

[project.scripts]
mbta-poller = "mbta_reliability.poller:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbta_reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]
