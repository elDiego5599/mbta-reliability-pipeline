name: mbta_reliability
version: "0.1.0"
config-version: 2
profile: mbta

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  mbta_reliability:
    staging:
      +schema: staging
      +materialized: view
      static:
        +materialized: table
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

vars:
  max_crossing_uncertainty_s: 90
  max_stop_shape_offset_m: 200
  max_segment_speed_kmh: 100
  max_frequent_headway_s: 900
  min_hour_coverage: 0.9
  min_headways_per_hour: 4
  bunching_ratio: 0.25
  gapping_ratio: 1.5
  on_time_early_s: -60
  on_time_late_s: 300
  poll_interval_s:
    VehiclePositions: 30
    TripUpdates: 300
    Alerts: 60
  intermediate_route_types: [0, 1, 3]
  excluded_route_descs: ['Rail Replacement Bus']
  fixture_build: false
