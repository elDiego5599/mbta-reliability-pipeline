name: mbta_reliability
version: "0.1.0"
config-version: 2
profile: mbta

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  mbta_reliability:
    staging:
      +schema: staging
      +materialized: view
      static:
        +materialized: table
    intermediate:
      +schema: intermediate
      +materialized: table

vars:
  poll_interval_s:
    VehiclePositions: 30
    TripUpdates: 300
    Alerts: 60
  intermediate_route_types: [0, 1, 3]
  excluded_route_descs: ['Rail Replacement Bus']
