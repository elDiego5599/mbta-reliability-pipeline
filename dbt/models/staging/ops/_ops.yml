version: 2

models:
  - name: stg_fetch_log
    description: One row per fetch attempt.
    columns:
      - name: feed
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [VehiclePositions, TripUpdates, Alerts]
      - name: attempt_at
        data_tests:
          - not_null
      - name: outcome
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [written, duplicate, unchanged, invalid, failed, retry]
    data_tests:
      - unique_combination:
          arguments:
            columns: [feed, attempt_at, attempt]
