version: 2

models:
  - name: stg_trip_updates
    description: >-
      One stop time update in one TripUpdates snapshot. Every silver row is
      kept; two rows with the same key fail the key test instead of being
      merged.
    data_tests:
      - unique_combination:
          arguments:
            columns: [trip__trip_id, trip__start_date, stop_time_update__stop_sequence, header_ts]
    columns:
      - name: header_ts
        data_tests: [not_null]
      - name: filename
        description: Silver hour file that holds the snapshot; filter on it to read one hour only.
      - name: trip__trip_id
        data_tests: [not_null]
      - name: trip__schedule_relationship
        data_tests:
          - accepted_values:
              arguments:
                values: [SCHEDULED, ADDED, UNSCHEDULED, CANCELED, REPLACEMENT, DUPLICATED, DELETED, NEW]
      - name: stop_time_update__schedule_relationship
        data_tests:
          - accepted_values:
              arguments:
                values: [SCHEDULED, SKIPPED, NO_DATA, UNSCHEDULED]

  - name: stg_vehicle_positions
    description: >-
      One row per vehicle report version (ADR 0009). Rows equal except
      header_ts collapse to the earliest, across hours. own_observation_ts is
      when the feed made the version, observation_ts the running maximum of it
      per vehicle and trip in (timestamp, header_ts) order, and
      observation_time_clamped marks rows where the two differ.
    data_tests:
      - unique_combination:
          arguments:
            columns: [vehicle__id, timestamp, header_ts]
    columns:
      - name: vehicle__id
        data_tests: [not_null]
      - name: timestamp
        data_tests: [not_null]
      - name: header_ts
        data_tests: [not_null]
      - name: observation_ts
        data_tests: [not_null]
      - name: current_status
        data_tests:
          - accepted_values:
              arguments:
                values: [INCOMING_AT, STOPPED_AT, IN_TRANSIT_TO]

  - name: stg_alerts
    description: >-
      One row per alert version: the same alert with the same content in
      consecutive Alerts snapshots. A content change or an absence from a
      snapshot starts a new version; active periods are compared by their
      start times only, so a change in end times alone does not split a
      version. first_active_period and last_active_period keep the active
      period of the first and of the last snapshot of the version.
      version_ended_ts is the first snapshot the version is missing from,
      null while it is in the latest one. header_text and description_text
      are the English translation, else the first.
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, version_first_seen_ts]
    columns:
      - name: alert_id
        data_tests: [not_null]
      - name: version_first_seen_ts
        data_tests: [not_null]

  - name: stg_alert_informed_entities
    description: >-
      One row per informed entity of an alert version, with its 1-based
      position in the list.
    data_tests:
      - unique_combination:
          arguments:
            columns: [alert_id, version_first_seen_ts, entity_index]
    columns:
      - name: alert_id
        data_tests: [not_null]
      - name: version_first_seen_ts
        data_tests: [not_null]
      - name: entity_index
        data_tests: [not_null]
