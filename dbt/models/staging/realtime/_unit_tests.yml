version: 2

unit_tests:
  - name: ut_vp_cross_hour_identical
    description: >-
      The same report in the last snapshot of one hour and the first of the next keeps the earlier header_ts; snapshot_date comes from that header_ts.
    model: stg_vehicle_positions
    given:
      - input: source('silver', 'vehicle_positions')
        format: sql
        rows: |
          select
            vehicle__id::varchar as vehicle__id,
            vehicle__label::varchar as vehicle__label,
            trip__trip_id::varchar as trip__trip_id,
            trip__start_date::varchar as trip__start_date,
            trip__direction_id::uinteger as trip__direction_id,
            stop_id::varchar as stop_id,
            current_stop_sequence::uinteger as current_stop_sequence,
            current_status::varchar as current_status,
            occupancy_status::varchar as occupancy_status,
            occupancy_percentage::uinteger as occupancy_percentage,
            timestamp::ubigint as timestamp,
            header_ts::bigint as header_ts,
            filename::varchar as filename,
            date::date as date
          from (values
            ('v1', 'L1', 'T1', '20261125', 0, 's1', 1, 'STOPPED_AT', 'EMPTY', null, 1795564780, 1795564790, 'hour=23.parquet', '2026-11-24'),
            ('v1', 'L1', 'T1', '20261125', 0, 's1', 1, 'STOPPED_AT', 'EMPTY', null, 1795564780, 1795564820, 'hour=00.parquet', '2026-11-25')
          ) as v(vehicle__id, vehicle__label, trip__trip_id, trip__start_date, trip__direction_id, stop_id, current_stop_sequence, current_status, occupancy_status, occupancy_percentage, timestamp, header_ts, filename, date)
    expect:
      rows:
        - {vehicle__id: 'v1', header_ts: 1795564790, snapshot_date: '2026-11-24'}
  - name: ut_vp_aba
    description: >-
      A, B, A keeps the first A and B; the return to A is lost, as in silver.
    model: stg_vehicle_positions
    given:
      - input: source('silver', 'vehicle_positions')
        format: sql
        rows: |
          select
            vehicle__id::varchar as vehicle__id,
            vehicle__label::varchar as vehicle__label,
            trip__trip_id::varchar as trip__trip_id,
            trip__start_date::varchar as trip__start_date,
            trip__direction_id::uinteger as trip__direction_id,
            stop_id::varchar as stop_id,
            current_stop_sequence::uinteger as current_stop_sequence,
            current_status::varchar as current_status,
            occupancy_status::varchar as occupancy_status,
            occupancy_percentage::uinteger as occupancy_percentage,
            timestamp::ubigint as timestamp,
            header_ts::bigint as header_ts,
            filename::varchar as filename,
            date::date as date
          from (values
            ('v1', 'L1', 'T1', '20261125', 0, 's1', 1, 'STOPPED_AT', 'EMPTY', null, 90, 100, 'hour=15.parquet', '2026-11-25'),
            ('v1', 'L1', 'T1', '20261125', 0, 's1', 1, 'STOPPED_AT', 'FULL', null, 90, 110, 'hour=15.parquet', '2026-11-25'),
            ('v1', 'L1', 'T1', '20261125', 0, 's1', 1, 'STOPPED_AT', 'EMPTY', null, 90, 120, 'hour=15.parquet', '2026-11-25')
          ) as v(vehicle__id, vehicle__label, trip__trip_id, trip__start_date, trip__direction_id, stop_id, current_stop_sequence, current_status, occupancy_status, occupancy_percentage, timestamp, header_ts, filename, date)
    expect:
      rows:
        - {header_ts: 100, occupancy_status: 'EMPTY'}
        - {header_ts: 110, occupancy_status: 'FULL'}
  - name: ut_vp_null_content_collapses
    description: >-
      Rows equal except header_ts collapse even when a column is null.
    model: stg_vehicle_positions
    given:
      - input: source('silver', 'vehicle_positions')
        format: sql
        rows: |
          select
            vehicle__id::varchar as vehicle__id,
            vehicle__label::varchar as vehicle__label,
            trip__trip_id::varchar as trip__trip_id,
            trip__start_date::varchar as trip__start_date,
            trip__direction_id::uinteger as trip__direction_id,
            stop_id::varchar as stop_id,
            current_stop_sequence::uinteger as current_stop_sequence,
            current_status::varchar as current_status,
            occupancy_status::varchar as occupancy_status,
            occupancy_percentage::uinteger as occupancy_percentage,
            timestamp::ubigint as timestamp,
            header_ts::bigint as header_ts,
            filename::varchar as filename,
            date::date as date
          from (values
            ('v1', null, 'T1', '20261125', 0, 's1', 1, 'STOPPED_AT', 'EMPTY', null, 90, 100, 'hour=15.parquet', '2026-11-25'),
            ('v1', null, 'T1', '20261125', 0, 's1', 1, 'STOPPED_AT', 'EMPTY', null, 90, 110, 'hour=15.parquet', '2026-11-25')
          ) as v(vehicle__id, vehicle__label, trip__trip_id, trip__start_date, trip__direction_id, stop_id, current_stop_sequence, current_status, occupancy_status, occupancy_percentage, timestamp, header_ts, filename, date)
    expect:
      rows:
        - {vehicle__id: 'v1', header_ts: 100}
