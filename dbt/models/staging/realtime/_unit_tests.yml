  - name: ut_alerts_unchanged_collapse
    description: >-
      An alert with the same content in three snapshots is one version.
    model: stg_alerts
    given:
      - input: source('silver', 'alerts')
        format: sql
        rows: |
          select
            v.header_ts::bigint as header_ts,
            v.entity_id::varchar as entity_id,
            null::boolean as is_deleted,
            v.active_period::struct("start" ubigint, "end" ubigint)[] as active_period,
            null::struct("start" ubigint, "end" ubigint)[] as communication_period,
            null::struct("start" ubigint, "end" ubigint)[] as impact_period,
            null::struct(agency_id varchar, route_id varchar, route_type integer, trip struct(trip_id varchar, route_id varchar, direction_id uinteger, start_time varchar, start_date varchar, schedule_relationship varchar, modified_trip struct(modifications_id varchar, affected_trip_id varchar, start_time varchar, start_date varchar)), stop_id varchar, direction_id uinteger)[] as informed_entity,
            null::varchar as cause,
            v.effect::varchar as effect,
            null::struct("text" varchar, "language" varchar)[] as url__translation,
            v.header_text__translation::struct("text" varchar, "language" varchar)[] as header_text__translation,
            null::struct("text" varchar, "language" varchar)[] as description_text__translation,
            null::struct("text" varchar, "language" varchar)[] as tts_header_text__translation,
            null::struct("text" varchar, "language" varchar)[] as tts_description_text__translation,
            v.severity_level::varchar as severity_level,
            null::struct(url varchar, media_type varchar, "language" varchar)[] as image__localized_image,
            null::struct("text" varchar, "language" varchar)[] as image_alternative_text__translation,
            null::struct("text" varchar, "language" varchar)[] as cause_detail__translation,
            null::struct("text" varchar, "language" varchar)[] as effect_detail__translation,
            'hour=15.parquet' as filename,
            date '2026-11-25' as date
          from (values
            (100, 'X', 'DELAY', 'WARNING', [{'text': 'hello', 'language': 'en'}], [{'start': 50, 'end': 1000}]),
            (200, 'X', 'DELAY', 'WARNING', [{'text': 'hello', 'language': 'en'}], [{'start': 50, 'end': 1000}]),
            (300, 'X', 'DELAY', 'WARNING', [{'text': 'hello', 'language': 'en'}], [{'start': 50, 'end': 1000}])
          ) as v(header_ts, entity_id, effect, severity_level, header_text__translation, active_period)
    expect:
      rows:
        - {alert_id: 'X', version_first_seen_ts: 100, version_last_seen_ts: 300, version_snapshot_count: 3, version_ended_ts: null}
