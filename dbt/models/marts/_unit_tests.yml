version: 2

unit_tests:
  - name: ut_dim_routes
    description: Keep the newest route attributes and derive mode and scope.
    model: dim_routes
    given:
      - input: ref('stg_static__versions')
        format: sql
        rows: |
          select
            v.feed_version::varchar as feed_version,
            v.first_seen_at::timestamptz as first_seen_at
          from (values
            ('V1', '2026-11-20 08:00+00'),
            ('V2', '2026-11-25 08:00+00'),
            ('V3', '2026-11-25 08:00+00')
          ) as v(feed_version, first_seen_at)
      - input: ref('stg_static__routes')
        format: sql
        rows: |
          select
            r.feed_version::varchar as feed_version,
            r.route_id::varchar as route_id,
            r.route_short_name::varchar as route_short_name,
            r.route_long_name::varchar as route_long_name,
            r.route_desc::varchar as route_desc,
            r.route_type::integer as route_type,
            r.route_color::varchar as route_color,
            r.route_text_color::varchar as route_text_color,
            r.route_sort_order::integer as route_sort_order,
            r.line_id::varchar as line_id
          from (values
            ('V1', 'R1', '1', 'Old', null, 1, null, null, null, null),
            ('V2', 'R1', '1', 'New', null, 1, null, null, null, null),
            ('V1', 'R2', '2', null, null, 3, null, null, null, null),
            ('V1', 'R0', '0', null, null, 0, null, null, null, null),
            ('V1', 'R4', '4', null, null, 4, null, null, null, null),
            ('V1', 'R7', '7', null, null, 7, null, null, null, null),
            ('V1', 'RR', 'RR', null, 'Rail Replacement Bus', 3, null, null, null, null),
            ('V1', 'R2C', '2C', null, null, 2, null, null, null, null),
            ('V2', 'R9', '9', null, null, 3, null, null, null, null),
            ('V3', 'R9', '9', null, null, 3, null, null, null, null)
          ) as r(feed_version, route_id, route_short_name, route_long_name, route_desc, route_type, route_color, route_text_color, route_sort_order, line_id)
    expect:
      format: sql
      rows: |
        select
          e.route_id::varchar as route_id,
          e.feed_version::varchar as feed_version,
          e.route_short_name::varchar as route_short_name,
          e.route_long_name::varchar as route_long_name,
          e.route_desc::varchar as route_desc,
          e.route_type::integer as route_type,
          e.mode::varchar as mode,
          e.route_color::varchar as route_color,
          e.route_text_color::varchar as route_text_color,
          e.route_sort_order::integer as route_sort_order,
          e.line_id::varchar as line_id,
          e.is_in_scope::boolean as is_in_scope
        from (values
          ('R1', 'V2', '1', 'New', null, 1, 'subway', null, null, null, null, true),
          ('R2', 'V1', '2', null, null, 3, 'bus', null, null, null, null, true),
          ('R0', 'V1', '0', null, null, 0, 'light_rail', null, null, null, null, true),
          ('R4', 'V1', '4', null, null, 4, 'ferry', null, null, null, null, false),
          ('R7', 'V1', '7', null, null, 7, 'other', null, null, null, null, false),
          ('RR', 'V1', 'RR', null, 'Rail Replacement Bus', 3, 'bus', null, null, null, null, false),
          ('R2C', 'V1', '2C', null, null, 2, 'commuter_rail', null, null, null, null, false),
          ('R9', 'V3', '9', null, null, 3, 'bus', null, null, null, null, true)
        ) as e(route_id, feed_version, route_short_name, route_long_name, route_desc, route_type, mode, route_color, route_text_color, route_sort_order, line_id, is_in_scope)

  - name: ut_dim_stops
    description: Keep the newest stop attributes and derive station_id.
    model: dim_stops
    given:
      - input: ref('stg_static__versions')
        format: sql
        rows: |
          select
            v.feed_version::varchar as feed_version,
            v.first_seen_at::timestamptz as first_seen_at
          from (values
            ('V1', '2026-11-20 08:00+00'),
            ('V2', '2026-11-25 08:00+00')
          ) as v(feed_version, first_seen_at)
      - input: ref('stg_static__stops')
        format: sql
        rows: |
          select
            s.feed_version::varchar as feed_version,
            s.stop_id::varchar as stop_id,
            s.stop_name::varchar as stop_name,
            s.parent_station::varchar as parent_station,
            s.location_type::integer as location_type,
            s.platform_name::varchar as platform_name,
            s.stop_lat::double as stop_lat,
            s.stop_lon::double as stop_lon,
            s.municipality::varchar as municipality
          from (values
            ('V1', 'S1', 'Old', null, 0, null, null, null, null),
            ('V2', 'S1', 'New', null, 0, null, null, null, null),
            ('V1', 'P1', null, 'PL1', 0, null, null, null, null),
            ('V1', 'PL1', null, null, 1, null, null, null, null)
          ) as s(feed_version, stop_id, stop_name, parent_station, location_type, platform_name, stop_lat, stop_lon, municipality)
    expect:
      format: sql
      rows: |
        select
          e.stop_id::varchar as stop_id,
          e.feed_version::varchar as feed_version,
          e.stop_name::varchar as stop_name,
          e.station_id::varchar as station_id,
          e.parent_station::varchar as parent_station,
          e.location_type::integer as location_type,
          e.platform_name::varchar as platform_name,
          e.stop_lat::double as stop_lat,
          e.stop_lon::double as stop_lon,
          e.municipality::varchar as municipality
        from (values
          ('S1', 'V2', 'New', 'S1', null, 0, null, null, null, null),
          ('P1', 'V1', null, 'PL1', 'PL1', 0, null, null, null, null),
          ('PL1', 'V1', null, 'PL1', null, 1, null, null, null, null)
        ) as e(stop_id, feed_version, stop_name, station_id, parent_station, location_type, platform_name, stop_lat, stop_lon, municipality)

  - name: ut_headways
    description: Pair crossings at the active-version measure point and ignore other stations.
    model: fct_headways
    given:
      - input: ref('int_stop_crossings')
        format: sql
        rows: |
          select
            c.service_date::date as service_date,
            c.trip_id::varchar as trip_id,
            c.stop_sequence::integer as stop_sequence,
            c.stop_id::varchar as stop_id,
            c.station_id::varchar as station_id,
            c.feed_version::varchar as feed_version,
            c.route_id::varchar as route_id,
            c.direction_id::integer as direction_id,
            c.route_pattern_id::varchar as route_pattern_id,
            c.trip_source::varchar as trip_source,
            c.crossing_ts::double as crossing_ts,
            c.crossing_method::varchar as crossing_method,
            c.crossing_uncertainty_s::bigint as crossing_uncertainty_s,
            c.uses_clamped_report::boolean as uses_clamped_report
          from (values
            ('2026-11-25', 'T1', 5, 'S_A', 'ST_A', 'V2', 'R1', 0, 'P_MAIN', 'scheduled', 1000.0, 'stopped', 30, false),
            ('2026-11-25', 'T2', 5, 'S_A', 'ST_A', 'V2', 'R1', 0, 'P_MAIN', 'scheduled', 1600.5, 'stopped', 30, false),
            ('2026-11-25', 'T_BR', 5, 'S_A', 'ST_A', 'V2', 'R1', 0, 'P_BRANCH', 'scheduled', 2000.0, 'stopped', 30, false),
            ('2026-11-25', 'T3', 5, 'S_A', 'ST_A', 'V2', 'R1', 0, 'P_MAIN', 'scheduled', 2500.0, 'stopped', 30, false),
            ('2026-11-25', 'T4', 5, 'S_A', 'ST_A', 'V2', 'R1', 0, 'P_MAIN', 'scheduled', 3700.0, 'stopped', 30, false),
            ('2026-11-25', 'TB1', 6, 'S_B', 'ST_B', 'V1', 'R1', 0, 'P_MAIN', 'scheduled', 1300.0, 'stopped', 30, false),
            ('2026-11-25', 'TC1', 7, 'S_C', 'ST_C', 'V2', 'R1', 0, 'P_MAIN', 'scheduled', 1200.0, 'stopped', 30, false)
          ) as c(service_date, trip_id, stop_sequence, stop_id, station_id, feed_version, route_id, direction_id, route_pattern_id, trip_source, crossing_ts, crossing_method, crossing_uncertainty_s, uses_clamped_report)
      - input: ref('int_static_active_version')
        format: sql
        rows: |
          select
            a.service_date::date as service_date,
            a.feed_version::varchar as feed_version
          from (values
            ('2026-11-25', 'V2')
          ) as a(service_date, feed_version)
      - input: ref('int_measure_points')
        format: sql
        rows: |
          select
            m.feed_version::varchar as feed_version,
            m.route_id::varchar as route_id,
            m.direction_id::integer as direction_id,
            m.station_id::varchar as station_id,
            m.stop_id::varchar as stop_id,
            m.stop_sequence::integer as stop_sequence
          from (values
            ('V2', 'R1', 0, 'ST_A', 'S_A', 5),
            ('V1', 'R1', 0, 'ST_B', 'S_B', 6)
          ) as m(feed_version, route_id, direction_id, station_id, stop_id, stop_sequence)
    expect:
      rows:
        - {service_date: '2026-11-25', route_id: 'R1', direction_id: 0, station_id: 'ST_A', stop_sequence: 5, trip_id: 'T2', prev_trip_id: 'T1', headway_s: 600.5, hour_start_ts: 0, headway_status: 'valid'}
        - {service_date: '2026-11-25', route_id: 'R1', direction_id: 0, station_id: 'ST_A', stop_sequence: 5, trip_id: 'T_BR', prev_trip_id: 'T2', headway_s: 399.5, hour_start_ts: 0, headway_status: 'valid'}
        - {service_date: '2026-11-25', route_id: 'R1', direction_id: 0, station_id: 'ST_A', stop_sequence: 5, trip_id: 'T3', prev_trip_id: 'T_BR', headway_s: 500.0, hour_start_ts: 0, headway_status: 'valid'}
        - {service_date: '2026-11-25', route_id: 'R1', direction_id: 0, station_id: 'ST_A', stop_sequence: 5, trip_id: 'T4', prev_trip_id: 'T3', headway_s: 1200.0, hour_start_ts: 3600, headway_status: 'valid'}

  - name: ut_headways_status
    description: Crossing status precedence applies to both crossings of a headway.
    model: fct_headways
    given:
      - input: ref('int_stop_crossings')
        format: sql
        rows: |
          select
            c.service_date::date as service_date,
            c.trip_id::varchar as trip_id,
            c.stop_sequence::integer as stop_sequence,
            c.stop_id::varchar as stop_id,
            c.station_id::varchar as station_id,
            c.feed_version::varchar as feed_version,
            c.route_id::varchar as route_id,
            c.direction_id::integer as direction_id,
            c.route_pattern_id::varchar as route_pattern_id,
            c.trip_source::varchar as trip_source,
            c.crossing_ts::double as crossing_ts,
            c.crossing_method::varchar as crossing_method,
            c.crossing_uncertainty_s::bigint as crossing_uncertainty_s,
            c.uses_clamped_report::boolean as uses_clamped_report
          from (values
            ('2026-11-25', 'R1_T1', 10, 'S1', 'ST1', 'V2', 'R1', 0, 'P1', 'scheduled', 0.0, 'stopped', 30, false),
            ('2026-11-25', 'R1_T2', 10, 'S1', 'ST1', 'V2', 'R1', 0, 'P1', 'scheduled', 300.0, 'stopped', 200, false),
            ('2026-11-25', 'R1_T3', 10, 'S1', 'ST1', 'V2', 'R1', 0, 'P1', 'scheduled', 600.0, 'stopped', 30, false),
            ('2026-11-25', 'R1_T4', 10, 'S1', 'ST1', 'V2', 'R1', 0, 'P1', 'scheduled', 900.0, 'stopped', 30, false),
            ('2026-11-25', 'R2_T1', 10, 'S1', 'ST1', 'V2', 'R2', 0, 'P2', 'scheduled', 0.0, 'stopped', 30, false),
            ('2026-11-25', 'R2_T2', 10, 'S1', 'ST1', 'V2', 'R2', 0, 'P2', 'scheduled', 300.0, 'stopped', 200, true),
            ('2026-11-25', 'R2_T3', 10, 'S1', 'ST1', 'V2', 'R2', 0, 'P2', 'scheduled', 600.0, 'stopped', 30, false),
            ('2026-11-25', 'R2_T4', 10, 'S1', 'ST1', 'V2', 'R2', 0, 'P2', 'scheduled', 900.0, 'stopped', 30, false),
            ('2026-11-25', 'R3_T1', 10, 'S1', 'ST1', 'V2', 'R3', 0, 'P3', 'scheduled', 0.0, 'stopped', 30, true),
            ('2026-11-25', 'R3_T2', 10, 'S1', 'ST1', 'V2', 'R3', 0, 'P3', 'scheduled', 300.0, 'stopped', 30, false),
            ('2026-11-25', 'R3_T3', 10, 'S1', 'ST1', 'V2', 'R3', 0, 'P3', 'scheduled', 600.0, 'stopped', 30, false),
            ('2026-11-25', 'R3_T4', 10, 'S1', 'ST1', 'V2', 'R3', 0, 'P3', 'scheduled', 900.0, 'stopped', 30, false)
          ) as c(service_date, trip_id, stop_sequence, stop_id, station_id, feed_version, route_id, direction_id, route_pattern_id, trip_source, crossing_ts, crossing_method, crossing_uncertainty_s, uses_clamped_report)
      - input: ref('int_static_active_version')
        format: sql
        rows: |
          select
            a.service_date::date as service_date,
            a.feed_version::varchar as feed_version
          from (values ('2026-11-25', 'V2')) as a(service_date, feed_version)
      - input: ref('int_measure_points')
        format: sql
        rows: |
          select
            m.feed_version::varchar as feed_version,
            m.route_id::varchar as route_id,
            m.direction_id::integer as direction_id,
            m.station_id::varchar as station_id,
            m.stop_id::varchar as stop_id,
            m.stop_sequence::integer as stop_sequence
          from (values
            ('V2', 'R1', 0, 'ST1', 'S1', 10),
            ('V2', 'R2', 0, 'ST1', 'S1', 10),
            ('V2', 'R3', 0, 'ST1', 'S1', 10)
          ) as m(feed_version, route_id, direction_id, station_id, stop_id, stop_sequence)
    expect:
      rows:
        - {route_id: 'R1', trip_id: 'R1_T2', stop_sequence: 10, headway_status: 'high_uncertainty'}
        - {route_id: 'R1', trip_id: 'R1_T3', stop_sequence: 10, headway_status: 'high_uncertainty'}
        - {route_id: 'R1', trip_id: 'R1_T4', stop_sequence: 10, headway_status: 'valid'}
        - {route_id: 'R2', trip_id: 'R2_T2', stop_sequence: 10, headway_status: 'clamped_report'}
        - {route_id: 'R2', trip_id: 'R2_T3', stop_sequence: 10, headway_status: 'clamped_report'}
        - {route_id: 'R2', trip_id: 'R2_T4', stop_sequence: 10, headway_status: 'valid'}
        - {route_id: 'R3', trip_id: 'R3_T2', stop_sequence: 10, headway_status: 'clamped_report'}
        - {route_id: 'R3', trip_id: 'R3_T3', stop_sequence: 10, headway_status: 'valid'}
        - {route_id: 'R3', trip_id: 'R3_T4', stop_sequence: 10, headway_status: 'valid'}

  - name: ut_headways_zero
    description: Zero headways are kept and ordered by trip_id.
    model: fct_headways
    given:
      - input: ref('int_stop_crossings')
        format: sql
        rows: |
          select
            c.service_date::date as service_date,
            c.trip_id::varchar as trip_id,
            c.stop_sequence::integer as stop_sequence,
            c.stop_id::varchar as stop_id,
            c.station_id::varchar as station_id,
            c.feed_version::varchar as feed_version,
            c.route_id::varchar as route_id,
            c.direction_id::integer as direction_id,
            c.route_pattern_id::varchar as route_pattern_id,
            c.trip_source::varchar as trip_source,
            c.crossing_ts::double as crossing_ts,
            c.crossing_method::varchar as crossing_method,
            c.crossing_uncertainty_s::bigint as crossing_uncertainty_s,
            c.uses_clamped_report::boolean as uses_clamped_report
          from (values
            ('2026-11-25', 'TB', 10, 'S1', 'ST1', 'V2', 'RZ', 0, 'PZ', 'scheduled', 500.0, 'stopped', 30, false),
            ('2026-11-25', 'TA', 10, 'S1', 'ST1', 'V2', 'RZ', 0, 'PZ', 'scheduled', 500.0, 'stopped', 30, false)
          ) as c(service_date, trip_id, stop_sequence, stop_id, station_id, feed_version, route_id, direction_id, route_pattern_id, trip_source, crossing_ts, crossing_method, crossing_uncertainty_s, uses_clamped_report)
      - input: ref('int_static_active_version')
        format: sql
        rows: |
          select a.service_date::date as service_date, a.feed_version::varchar as feed_version
          from (values ('2026-11-25', 'V2')) as a(service_date, feed_version)
      - input: ref('int_measure_points')
        format: sql
        rows: |
          select
            m.feed_version::varchar as feed_version,
            m.route_id::varchar as route_id,
            m.direction_id::integer as direction_id,
            m.station_id::varchar as station_id,
            m.stop_id::varchar as stop_id,
            m.stop_sequence::integer as stop_sequence
          from (values ('V2', 'RZ', 0, 'ST1', 'S1', 10))
          as m(feed_version, route_id, direction_id, station_id, stop_id, stop_sequence)
    expect:
      rows:
        - {trip_id: 'TB', prev_trip_id: 'TA', headway_s: 0.0, headway_status: 'valid'}

  - name: ut_headways_service_date_boundary
    description: Crossings on adjacent service dates never pair.
    model: fct_headways
    given:
      - input: ref('int_stop_crossings')
        format: sql
        rows: |
          select
            c.service_date::date as service_date,
            c.trip_id::varchar as trip_id,
            c.stop_sequence::integer as stop_sequence,
            c.stop_id::varchar as stop_id,
            c.station_id::varchar as station_id,
            c.feed_version::varchar as feed_version,
            c.route_id::varchar as route_id,
            c.direction_id::integer as direction_id,
            c.route_pattern_id::varchar as route_pattern_id,
            c.trip_source::varchar as trip_source,
