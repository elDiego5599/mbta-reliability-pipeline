  - name: ut_adherence
    description: Departure adherence, inclusive on-time boundaries, and early and late cases.
    model: fct_schedule_adherence
    given:
      - input: ref('int_stop_crossings')
        format: sql
        rows: |
          select
            c.service_date::date as service_date,
            c.trip_id::varchar as trip_id,
            c.stop_sequence::integer as stop_sequence,
            c.route_id::varchar as route_id,
            c.direction_id::integer as direction_id,
            c.route_pattern_id::varchar as route_pattern_id,
            c.feed_version::varchar as feed_version,
            c.stop_id::varchar as stop_id,
            c.station_id::varchar as station_id,
            c.checkpoint_id::varchar as checkpoint_id,
            c.trip_source::varchar as trip_source,
            c.crossing_ts::double as crossing_ts,
            c.crossing_method::varchar as crossing_method,
            c.crossing_uncertainty_s::bigint as crossing_uncertainty_s,
            c.uses_clamped_report::boolean as uses_clamped_report
          from (values
            ('2026-11-25', 'T1', 1, 'R1', 0, 'P1', 'V1', 'S1', 'ST1', 'C1', 'scheduled', 940.0, 'stopped', 30, false),
            ('2026-11-25', 'T1', 2, 'R1', 0, 'P1', 'V1', 'S1', 'ST1', 'C1', 'scheduled', 2300.0, 'stopped', 30, false),
            ('2026-11-25', 'T1', 3, 'R1', 0, 'P1', 'V1', 'S1', 'ST1', 'C1', 'scheduled', 2939.0, 'stopped', 30, false),
            ('2026-11-25', 'T1', 4, 'R1', 0, 'P1', 'V1', 'S1', 'ST1', 'C1', 'scheduled', 4301.0, 'stopped', 30, false)
          ) as c(service_date, trip_id, stop_sequence, route_id, direction_id, route_pattern_id, feed_version, stop_id, station_id, checkpoint_id, trip_source, crossing_ts, crossing_method, crossing_uncertainty_s, uses_clamped_report)
      - input: ref('int_scheduled_stop_times')
        format: sql
        rows: |
          select
            s.service_date::date as service_date,
            s.trip_id::varchar as trip_id,
            s.stop_sequence::integer as stop_sequence,
            s.route_id::varchar as route_id,
            s.direction_id::integer as direction_id,
            s.route_pattern_id::varchar as route_pattern_id,
            s.feed_version::varchar as feed_version,
            s.stop_id::varchar as stop_id,
            s.station_id::varchar as station_id,
            s.checkpoint_id::varchar as checkpoint_id,
            s.scheduled_arrival_ts::double as scheduled_arrival_ts,
            s.scheduled_departure_ts::double as scheduled_departure_ts
          from (values
            ('2026-11-25', 'T1', 1, 'R1', 0, 'P1', 'V1', 'S1', 'ST1', 'C1', 950.0, 1000.0),
