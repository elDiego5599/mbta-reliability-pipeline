version: 2

models:
  - name: dim_routes
    description: One route per route_id, with attributes from its newest static version.
    data_tests:
      - unique_combination:
          arguments:
            columns: [route_id]
    columns:
      - name: route_id
        data_tests: [not_null]
      - name: feed_version
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_static__versions')
                field: feed_version
      - name: mode
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [light_rail, subway, commuter_rail, bus, ferry, other]
      - name: is_in_scope
        data_tests: [not_null]

  - name: dim_stops
    description: One stop per stop_id, with attributes from its newest static version.
    data_tests:
      - unique_combination:
          arguments:
            columns: [stop_id]
    columns:
      - name: stop_id
        data_tests: [not_null]
      - name: feed_version
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_static__versions')
                field: feed_version
      - name: station_id
        data_tests: [not_null]

  - name: fct_headways
    description: One observed headway at a route measure point.
    data_tests:
      - unique_combination:
          arguments:
            columns: [service_date, trip_id, stop_sequence]
    columns:
      - name: service_date
        data_tests: [not_null]
      - name: route_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_routes')
                field: route_id
      - name: direction_id
        data_tests: [not_null]
      - name: feed_version
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_static__versions')
                field: feed_version
      - name: station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stops')
                field: stop_id
      - name: stop_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stops')
                field: stop_id
      - name: trip_id
        data_tests: [not_null]
      - name: stop_sequence
        data_tests: [not_null]
      - name: headway_s
        data_tests: [not_null]
      - name: hour_start_ts
        data_tests: [not_null]
      - name: headway_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [valid, clamped_report, high_uncertainty]

  - name: fct_schedule_adherence
    description: One observed crossing joined to its scheduled timepoint.
    data_tests:
      - unique_combination:
          arguments:
            columns: [service_date, trip_id, stop_sequence]
    columns:
      - name: service_date
        data_tests: [not_null]
      - name: trip_id
        data_tests: [not_null]
      - name: stop_sequence
        data_tests: [not_null]
      - name: route_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_routes')
                field: route_id
      - name: direction_id
        data_tests: [not_null]
      - name: route_pattern_id
        data_tests: [not_null]
      - name: feed_version
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_static__versions')
                field: feed_version
      - name: stop_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stops')
                field: stop_id
      - name: station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stops')
                field: stop_id
      - name: checkpoint_id
        data_tests: [not_null]
      - name: crossing_ts
        data_tests: [not_null]
      - name: crossing_local
        data_tests: [not_null]
      - name: scheduled_ts
        data_tests: [not_null]
      - name: scheduled_local
        data_tests: [not_null]
      - name: scheduled_reference
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [departure, arrival]
      - name: hour_start_ts
        data_tests: [not_null]
      - name: adherence_s
        data_tests: [not_null]
      - name: is_on_time
        data_tests: [not_null]
      - name: crossing_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [stopped, interpolated, terminal_arrival]
      - name: crossing_uncertainty_s
        data_tests: [not_null]
      - name: adherence_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [valid, clamped_report, high_uncertainty]

  - name: agg_route_hour_reliability
    description: One route-hour reliability summary with schedule, coverage, headway, and adherence metrics.
    data_tests:
      - unique_combination:
          arguments:
            columns: [service_date, route_id, direction_id, hour_start_ts]
    columns:
      - name: service_date
        data_tests: [not_null]
      - name: route_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_routes')
                field: route_id
      - name: direction_id
        data_tests: [not_null]
      - name: hour_start_ts
        data_tests: [not_null]
      - name: scheduled_headway_count
        data_tests: [not_null]
      - name: vp_coverage
        data_tests: [not_null]
      - name: headway_count
        data_tests: [not_null]
      - name: valid_headway_count
        data_tests: [not_null]
      - name: excluded_uncertainty_count
        data_tests: [not_null]
      - name: excluded_clamped_count
        data_tests: [not_null]
      - name: headway_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [no_schedule, not_frequent, low_coverage, too_few_headways, reported]
      - name: adherence_count
        data_tests: [not_null]
      - name: valid_adherence_count
        data_tests: [not_null]
