  - name: ut_trip_paths
    description: >-
      A trip uses its scheduled path or the active-version pattern with the
      highest matching share, excluding opposite directions and out-of-scope routes.
    model: int_trip_paths
    given:
      - input: ref('int_static_active_version')
        format: sql
        rows: |
          select
            v.service_date::date as service_date,
            v.feed_version::varchar as feed_version
          from (values
            ('2026-11-25', 'V')
          ) as v(service_date, feed_version)
      - input: ref('stg_vehicle_positions')
        format: sql
        rows: |
          select
            v.trip__trip_id::varchar as trip__trip_id,
            v.trip__start_date::varchar as trip__start_date,
            v.trip__route_id::varchar as trip__route_id,
            v.trip__direction_id::integer as trip__direction_id,
            v.stop_id::varchar as stop_id,
            v.current_stop_sequence::integer as current_stop_sequence,
            v.vehicle__id::varchar as vehicle__id
          from (values
            ('T_SCHED', '20261125', 'R', 0, 'sa', 1, 'v1'),
            ('T_SCHED', '20261125', 'R', 1, 'sb', 2, 'v1'),
            ('T_SCHED', '20261125', null, null, 'sc', 3, 'v1'),
            ('T_ADD', '20261125', 'R', 0, 'sa', 1, 'v1'),
            ('T_ADD', '20261125', 'R', 0, 'sb', 2, 'v1'),
            ('T_ADD', '20261125', 'R', 0, 'sc', 3, 'v1'),
            ('T_ADD', '20261125', 'R', 0, 'sz', 9, 'v1'),
            ('T_TIE', '20261125', 'R', 0, 'sa', 1, 'v1'),
            ('T_TWO', '20261125', 'GA', 0, 'g1', 1, 'v1'),
            ('T_TWO', '20261125', 'GA', 0, 'g2', 2, 'v1'),
            ('T_TWO', '20261125', 'GB', 0, 'g3', 3, 'v2'),
            ('T_LOW', '20261125', 'R', 0, 'sa', 1, 'v1'),
            ('T_LOW', '20261125', 'R', 0, 'zz', 7, 'v1'),
            ('T_LOW', '20261125', 'R', 0, 'zq', 8, 'v1'),
            ('T_CRX', '20261125', 'CR', 0, 'cr1', 1, 'v1'),
            ('T_NOSTART', null, 'R', 0, 'sa', 1, 'v1')
