            ('V', 'sx', null, 42.4, -71.4),
            ('V', 'sy', null, 42.5, -71.5),
            ('V', 'g1', null, 42.6, -71.6),
            ('V', 'h2', null, 42.7, -71.7),
            ('V', 'g2', null, 42.8, -71.8),
            ('V', 'g3', null, 42.9, -71.9),
            ('V', 'zz', null, 43.0, -72.0),
            ('V', 'zq', null, 43.1, -72.1),
            ('V', 'cr1', null, 43.2, -72.2),
            ('V', 'cr2', null, 43.3, -72.3)
          ) as s(feed_version, stop_id, parent_station, stop_lat, stop_lon)
      - input: ref('stg_static__routes')
        format: sql
        rows: |
          select
            r.feed_version::varchar as feed_version,
            r.route_id::varchar as route_id,
            r.route_type::integer as route_type,
            r.route_desc::varchar as route_desc
          from (values
            ('V', 'R', 1, 'Rapid Transit'),
            ('V', 'GA', 0, 'Light Rail'),
            ('V', 'GB', 0, 'Light Rail'),
            ('V', 'CR', 2, 'Commuter Rail')
          ) as r(feed_version, route_id, route_type, route_desc)
