name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      # dbt build runs these again; this step fails fast and needs no data.
      - name: dbt unit tests
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
          MBTA_DATA_DIR: /nonexistent
          MBTA_WAREHOUSE: ${{ runner.temp }}/unit.duckdb
        run: uv run dbt test --select "test_type:unit"
      - name: Generate the dbt fixture
        run: uv run python tests/dbt_fixture.py "$RUNNER_TEMP/fixture"
      - name: dbt build on the fixture
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
          MBTA_DATA_DIR: ${{ runner.temp }}/fixture
          MBTA_WAREHOUSE: ${{ runner.temp }}/fixture/warehouse.duckdb
        run: uv run dbt build --vars '{fixture_build: true}'
